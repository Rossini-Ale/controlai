<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Controlaí — Perfil</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      .perfil-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .perfil-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 24px;
      }
      .perfil-card h2 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .perfil-card h2 i {
        color: var(--green);
      }
      .avatar-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding: 16px;
        background: var(--bg-tertiary);
        border-radius: 12px;
      }
      .avatar-grande {
        width: 64px;
        height: 64px;
        background: var(--green);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat-item {
        background: var(--bg-tertiary);
        border-radius: 10px;
        padding: 14px;
        text-align: center;
      }
      .stat-valor {
        font-size: 20px;
        font-weight: 700;
        color: var(--green);
        margin-bottom: 4px;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .telegram-status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 16px;
        font-size: 13px;
      }
      .telegram-status.conectado {
        background: rgba(16, 185, 129, 0.1);
        border: 0.5px solid var(--green);
        color: var(--green);
      }
      .telegram-status.desconectado {
        background: rgba(107, 114, 128, 0.1);
        border: 0.5px solid var(--border);
        color: var(--text-muted);
      }
      @media (max-width: 768px) {
        .perfil-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="mobileheader"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <h1 class="page-title">Perfil</h1>
      <div class="perfil-grid">
        <div>
          <div class="perfil-card" style="margin-bottom: 20px">
            <div class="avatar-wrap">
              <div class="avatar-grande" id="avatar-iniciais">--</div>
              <div>
                <h3
                  id="perfil-nome"
                  style="font-size: 16px; font-weight: 600; margin-bottom: 4px"
                >
                  Carregando...
                </h3>
                <p
                  id="perfil-username"
                  style="font-size: 13px; color: var(--text-muted)"
                >
                  @username
                </p>
                <p
                  id="perfil-membro"
                  style="
                    font-size: 13px;
                    color: var(--text-muted);
                    margin-top: 2px;
                  "
                ></p>
              </div>
            </div>
            <div class="stats-grid">
              <div class="stat-item">
                <div class="stat-valor" id="stat-tx">—</div>
                <div class="stat-label">Transações</div>
              </div>
              <div class="stat-item">
                <div class="stat-valor" id="stat-cat">—</div>
                <div class="stat-label">Categorias</div>
              </div>
              <div class="stat-item">
                <div class="stat-valor" id="stat-con">—</div>
                <div class="stat-label">Contas</div>
              </div>
              <div class="stat-item">
                <div class="stat-valor" id="stat-met">—</div>
                <div class="stat-label">Metas</div>
              </div>
            </div>
          </div>
          <div class="perfil-card">
            <h2><i class="fa-brands fa-telegram"></i> Telegram Bot</h2>
            <div class="telegram-status" id="telegram-status">
              <i class="fa-solid fa-circle"></i
              ><span id="telegram-texto">Verificando...</span>
            </div>
            <p
              style="
                font-size: 12px;
                color: var(--text-muted);
                line-height: 1.6;
              "
            >
              Conecte sua conta usando o comando no bot
              <strong>@controlai_bot</strong>:
            </p>
            <div
              style="
                background: var(--bg-tertiary);
                border-radius: 8px;
                padding: 10px 14px;
                margin-top: 10px;
                font-family: monospace;
                font-size: 13px;
                color: var(--green);
              "
              id="telegram-cmd"
            >
              /conectar seu_username
            </div>
          </div>
        </div>
        <div>
          <div class="perfil-card" style="margin-bottom: 20px">
            <h2><i class="fa-solid fa-pen"></i> Editar informações</h2>
            <div class="form-group">
              <label>Nome completo</label><input type="text" id="e-nome" />
            </div>
            <div class="form-group">
              <label>Email</label><input type="email" id="e-email" />
            </div>
            <div class="form-group">
              <label>Username</label
              ><input
                type="text"
                id="e-username"
                disabled
                style="opacity: 0.5; cursor: not-allowed"
              />
            </div>
            <button
              class="btn"
              onclick="salvarPerfil()"
              style="width: 100%; justify-content: center"
            >
              <i class="fa-solid fa-check"></i> Salvar
            </button>
          </div>
          <div class="perfil-card">
            <h2><i class="fa-solid fa-lock"></i> Alterar senha</h2>
            <div class="form-group">
              <label>Senha atual</label
              ><input type="password" id="s-atual" placeholder="••••••••" />
            </div>
            <div class="form-group">
              <label>Nova senha</label
              ><input type="password" id="s-nova" placeholder="••••••••" />
            </div>
            <div class="form-group">
              <label>Confirmar nova senha</label
              ><input type="password" id="s-confirma" placeholder="••••••••" />
            </div>
            <button
              class="btn"
              onclick="alterarSenha()"
              style="width: 100%; justify-content: center"
            >
              <i class="fa-solid fa-lock"></i> Alterar senha
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>
    <script src="/js/storage.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML = renderSidebar("Perfil");
      document.getElementById("mobileheader").innerHTML =
        renderMobileHeader("Perfil");
      document.getElementById("tabbar").innerHTML = renderTabBar("Perfil");

      async function carregarPerfil() {
        const perfil = await fetchAPI("/api/auth/perfil");
        if (!perfil) return;
        const iniciais = perfil.nome
          .split(" ")
          .map((n) => n[0])
          .join("")
          .substring(0, 2)
          .toUpperCase();
        document.getElementById("avatar-iniciais").textContent = iniciais;
        document.getElementById("perfil-nome").textContent = perfil.nome;
        document.getElementById("perfil-username").textContent =
          `@${perfil.username}`;
        document.getElementById("perfil-membro").textContent =
          `Membro desde ${new Date(perfil.created_at).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}`;
        document.getElementById("e-nome").value = perfil.nome;
        document.getElementById("e-email").value = perfil.email;
        document.getElementById("e-username").value = perfil.username;
        document.getElementById("telegram-cmd").textContent =
          `/conectar ${perfil.username}`;
        const st = document.getElementById("telegram-status"),
          tx = document.getElementById("telegram-texto");
        if (perfil.telegram_chat_id) {
          st.className = "telegram-status conectado";
          tx.textContent = "Conta conectada ao Telegram";
          st.querySelector("i").className = "fa-solid fa-circle-check";
        } else {
          st.className = "telegram-status desconectado";
          tx.textContent = "Telegram não conectado";
          st.querySelector("i").className = "fa-solid fa-circle-xmark";
        }
        const [tRes, c, co, m] = await Promise.all([
          fetchAPI("/api/transacoes?limit=100"),
          fetchAPI("/api/categorias"),
          fetchAPI("/api/contas"),
          fetchAPI("/api/metas"),
        ]);
        const t = Array.isArray(tRes) ? tRes : tRes?.data || [];
        document.getElementById("stat-tx").textContent = t?.length || 0;
        document.getElementById("stat-cat").textContent = c?.length || 0;
        document.getElementById("stat-con").textContent = co?.length || 0;
        document.getElementById("stat-met").textContent = m?.length || 0;
      }

      async function salvarPerfil() {
        const body = {
          nome: document.getElementById("e-nome").value,
          email: document.getElementById("e-email").value,
        };
        if (!body.nome || !body.email) {
          toast("Preencha nome e email.", "erro");
          return;
        }
        const res = await fetchAPI("/api/auth/perfil", {
          method: "PUT",
          body: JSON.stringify(body),
        });
        if (res?.erro) {
          toast(res.erro, "erro");
          return;
        }
        localStorage.setItem("controlai_nome", body.nome);
        toast("Perfil atualizado!");
        carregarPerfil();
      }

      async function alterarSenha() {
        const atual = document.getElementById("s-atual").value,
          nova = document.getElementById("s-nova").value,
          confirma = document.getElementById("s-confirma").value;
        if (!atual || !nova || !confirma) {
          toast("Preencha todos os campos.", "erro");
          return;
        }
        if (nova !== confirma) {
          toast("As senhas não coincidem.", "erro");
          return;
        }
        if (nova.length < 6) {
          toast("Mínimo 6 caracteres.", "aviso");
          return;
        }
        const res = await fetchAPI("/api/auth/perfil/senha", {
          method: "PUT",
          body: JSON.stringify({ senha_atual: atual, nova_senha: nova }),
        });
        if (res?.erro) {
          toast(res.erro, "erro");
          return;
        }
        toast("Senha alterada!");
        ["s-atual", "s-nova", "s-confirma"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
      }

      carregarPerfil();
    </script>
  </body>
</html>
