<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Controlaí" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <title>Controlaí — Contas</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      .contas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }
      .conta-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .conta-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--cor);
      }
      .conta-tipo {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .conta-nome {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .conta-saldo-label {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .conta-saldo {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .conta-acoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn-transferir {
        background: rgba(99, 102, 241, 0.15);
        border: 0.5px solid #6366f1;
        color: #6366f1;
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .btn-transferir:hover {
        background: #6366f1;
        color: #fff;
      }
      .transferencias-wrap {
        margin-top: 32px;
      }
      .transferencia-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 0.5px solid var(--border);
        transition: background 0.15s;
      }
      .transferencia-item:hover {
        background: var(--bg-tertiary);
      }
      .transferencia-item:last-child {
        border-bottom: none;
      }
      .transferencia-item-mobile {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
        border-left: 3px solid #6366f1;
      }
    </style>
  </head>
  <body>
    <div id="mobileheader"></div>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 24px;
        "
      >
        <h1 class="page-title" style="margin: 0">Contas</h1>
        <div style="display: flex; gap: 8px">
          <button
            class="btn"
            style="background: #6366f1"
            onclick="abrirModalTransferir()"
          >
            <i class="fa-solid fa-right-left"></i> Transferir
          </button>
          <button class="btn" onclick="abrirModal()">
            <i class="fa-solid fa-plus"></i> Nova conta
          </button>
        </div>
      </div>

      <div class="contas-grid" id="contas-grid"></div>

      <div class="transferencias-wrap">
        <div class="table-wrap">
          <div class="table-header">
            <h2>
              <i
                class="fa-solid fa-right-left"
                style="color: #6366f1; margin-right: 6px"
              ></i
              >Transferências
            </h2>
          </div>
          <div class="desktop-only" id="tabela-transferencias-desktop">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Descrição</th>
                  <th>Origem</th>
                  <th>Destino</th>
                  <th>Valor</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tbody-transferencias"></tbody>
            </table>
          </div>
          <div
            class="mobile-only"
            id="lista-transferencias-mobile"
            style="padding: 12px"
          ></div>
        </div>
      </div>
    </div>

    <!-- Modal conta -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h2 id="modal-titulo">Nova conta</h2>
        <div class="form-group">
          <label>Nome da conta</label
          ><input
            type="text"
            id="f-nome"
            placeholder="Ex: Nubank, Carteira..."
          />
        </div>
        <div class="form-group">
          <label>Tipo</label
          ><select id="f-tipo">
            <option value="corrente">Conta corrente</option>
            <option value="poupanca">Poupança</option>
            <option value="carteira">Carteira</option>
            <option value="investimento">Investimento</option>
          </select>
        </div>
        <div class="form-group">
          <label>Saldo inicial</label
          ><input type="number" id="f-saldo" placeholder="0,00" step="0.01" />
        </div>
        <div class="form-group">
          <label>Cor</label
          ><input
            type="color"
            id="f-cor"
            value="#10b981"
            style="height: 40px; cursor: pointer"
          />
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button class="btn" onclick="salvar()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- Modal transferência -->
    <div class="modal-overlay" id="modal-transferir">
      <div class="modal">
        <h2 id="modal-transferir-titulo">Nova transferência</h2>
        <div class="form-group">
          <label>Valor (R$)</label
          ><input
            type="number"
            id="t-valor"
            placeholder="0,00"
            step="0.01"
            min="0"
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div class="form-group">
            <label>Conta origem</label
            ><select id="t-origem"></select>
          </div>
          <div class="form-group">
            <label>Conta destino</label
            ><select id="t-destino"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Data</label><input type="date" id="t-data" />
        </div>
        <div class="form-group">
          <label>Descrição (opcional)</label
          ><input
            type="text"
            id="t-descricao"
            placeholder="Ex: Reserva de emergência..."
          />
        </div>
        <div class="form-group">
          <label>Observação (opcional)</label
          ><input type="text" id="t-obs" placeholder="Alguma observação..." />
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModalTransferir()">
            Cancelar
          </button>
          <button
            class="btn"
            style="background: #6366f1"
            onclick="salvarTransferencia()"
          >
            <i class="fa-solid fa-right-left"></i> Transferir
          </button>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>
    <script src="/js/global.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML = renderSidebar("Contas");
      document.getElementById("mobileheader").innerHTML =
        renderMobileHeader("Contas");
      document.getElementById("tabbar").innerHTML = renderTabBar("Contas");

      let editandoId = null,
        editandoTransferenciaId = null,
        contasCache = [];
      document.getElementById("t-data").value = new Date()
        .toISOString()
        .split("T")[0];

      function isMobile() {
        return window.innerWidth <= 768;
      }

      async function carregarContas() {
        document.getElementById("contas-grid").innerHTML = skeletonCards(3);
        contasCache = (await fetchAPI("/api/contas")) || [];
        const saldos = (await fetchAPI("/api/relatorios/saldo-contas")) || [];
        const grid = document.getElementById("contas-grid");
        if (contasCache.length === 0) {
          grid.innerHTML = emptyState(
            "fa-wallet",
            "Nenhuma conta",
            "Adicione sua primeira conta bancária ou carteira.",
            "Nova conta",
            "abrirModal()",
          );
          return;
        }
        grid.innerHTML = contasCache
          .map((c) => {
            const saldo = saldos.find((s) => s.nome === c.nome);
            const saldoAtual = saldo
              ? parseFloat(saldo.saldo_atual) || 0
              : parseFloat(c.saldo_inicial) || 0;
            const cor = c.cor || "#10b981";
            const tipoLabel =
              {
                corrente: "Conta corrente",
                poupanca: "Poupança",
                carteira: "Carteira",
                investimento: "Investimento",
              }[c.tipo] || c.tipo;
            return `<div class="conta-card" style="--cor:${cor}">
            <div class="conta-tipo">${tipoLabel}</div>
            <div class="conta-nome">${c.nome}</div>
            <div class="conta-saldo-label">Saldo atual</div>
            <div class="conta-saldo" style="color:${saldoAtual >= 0 ? "var(--green)" : "var(--red)"}">  ${formatarMoeda(saldoAtual)}</div>
            <div class="conta-acoes">
              <button class="btn-transferir" onclick="abrirModalTransferir(${c.id})"><i class="fa-solid fa-right-left"></i> Transferir</button>
              <button class="btn-edit" onclick="editar(${c.id},'${c.nome}','${c.tipo}',${c.saldo_inicial},'${cor}')"><i class="fa-solid fa-pen"></i> Editar</button>
              <button class="btn-danger" onclick="deletar(${c.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`;
          })
          .join("");
      }

      async function carregarTransferencias() {
        const data = (await fetchAPI("/api/transferencias")) || [];
        if (isMobile()) renderTransferenciasMobile(data);
        else renderTransferenciasDesktop(data);
      }

      function renderTransferenciasDesktop(data) {
        const tbody = document.getElementById("tbody-transferencias");
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="padding:0"><div style="padding:16px">${emptyState("fa-right-left", "Nenhuma transferência", "Transfira valores entre suas contas.", "Transferir", "abrirModalTransferir()")}</div></td></tr>`;
          return;
        }
        tbody.innerHTML = data
          .map(
            (t) => `<tr>
          <td>${formatarData(t.data)}</td>
          <td>${t.descricao}</td>
          <td><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${t.conta_origem_cor || "#6b7280"}"></span>${t.conta_origem}</span></td>
          <td><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${t.conta_destino_cor || "#6b7280"}"></span>${t.conta_destino}</span></td>
          <td><span style="font-weight:700;color:#6366f1">${formatarMoeda(t.valor)}</span></td>
          <td style="display:flex;gap:6px">
            <button class="btn-edit" onclick="editarTransferencia('${t.transferencia_id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-danger" onclick="deletarTransferencia('${t.transferencia_id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`,
          )
          .join("");
      }

      function renderTransferenciasMobile(data) {
        const lista = document.getElementById("lista-transferencias-mobile");
        if (data.length === 0) {
          lista.innerHTML = emptyState(
            "fa-right-left",
            "Nenhuma transferência",
            "Transfira valores entre suas contas.",
            "Transferir",
            "abrirModalTransferir()",
          );
          return;
        }
        lista.innerHTML = data
          .map(
            (t) => `<div class="transferencia-item-mobile">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div>
              <div style="font-size:14px;font-weight:600;margin-bottom:4px">${t.descricao}</div>
              <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
                <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:${t.conta_origem_cor || "#6b7280"}"></span>${t.conta_origem}</span>
                <i class="fa-solid fa-arrow-right" style="font-size:10px"></i>
                <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:${t.conta_destino_cor || "#6b7280"}"></span>${t.conta_destino}</span>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:700;color:#6366f1">${formatarMoeda(t.valor)}</div>
              <div style="font-size:11px;color:var(--text-muted)">${formatarData(t.data)}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn-edit" style="padding:6px 14px;font-size:12px" onclick="editarTransferencia('${t.transferencia_id}')"><i class="fa-solid fa-pen"></i> Editar</button>
            <button class="btn-danger" style="padding:6px 14px;font-size:12px" onclick="deletarTransferencia('${t.transferencia_id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`,
          )
          .join("");
      }

      function abrirModal() {
        editandoId = null;
        document.getElementById("modal-titulo").textContent = "Nova conta";
        document.getElementById("f-nome").value = "";
        document.getElementById("f-tipo").value = "corrente";
        document.getElementById("f-saldo").value = "";
        document.getElementById("f-cor").value = "#10b981";
        document.getElementById("modal").classList.add("active");
      }
      function fecharModal() {
        document.getElementById("modal").classList.remove("active");
      }
      function editar(id, nome, tipo, saldo, cor) {
        editandoId = id;
        document.getElementById("modal-titulo").textContent = "Editar conta";
        document.getElementById("f-nome").value = nome;
        document.getElementById("f-tipo").value = tipo;
        document.getElementById("f-saldo").value = saldo;
        document.getElementById("f-cor").value = cor;
        document.getElementById("modal").classList.add("active");
      }

      async function salvar() {
        const body = {
          nome: document.getElementById("f-nome").value,
          tipo: document.getElementById("f-tipo").value,
          saldo_inicial:
            parseFloat(document.getElementById("f-saldo").value) || 0,
          cor: document.getElementById("f-cor").value,
        };
        if (!body.nome) {
          toast("Informe o nome da conta.", "erro");
          return;
        }
        if (editandoId) {
          await fetchAPI(`/api/contas/${editandoId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          toast("Conta atualizada!");
        } else {
          await fetchAPI("/api/contas", {
            method: "POST",
            body: JSON.stringify(body),
          });
          toast("Conta criada!");
        }
        fecharModal();
        carregarContas();
        carregarTransferencias();
      }

      async function deletar(id) {
        const ok = await confirmar("Deseja deletar esta conta?");
        if (!ok) return;
        await fetchAPI(`/api/contas/${id}`, { method: "DELETE" });
        toast("Conta deletada!", "info");
        carregarContas();
        carregarTransferencias();
      }

      function preencherSelectsTransferencia(origemId = null) {
        const opts = contasCache.length
          ? contasCache
              .map((c) => `<option value="${c.id}">${c.nome}</option>`)
              .join("")
          : `<option value="">Sem contas</option>`;
        document.getElementById("t-origem").innerHTML = opts;
        document.getElementById("t-destino").innerHTML = opts;
        if (origemId) document.getElementById("t-origem").value = origemId;
        const primeiroDestino = contasCache.find(
          (c) => c.id !== parseInt(document.getElementById("t-origem").value),
        );
        if (primeiroDestino)
          document.getElementById("t-destino").value = primeiroDestino.id;
      }

      function abrirModalTransferir(origemId = null) {
        editandoTransferenciaId = null;
        document.getElementById("modal-transferir-titulo").textContent =
          "Nova transferência";
        document.getElementById("t-valor").value = "";
        document.getElementById("t-data").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("t-descricao").value = "";
        document.getElementById("t-obs").value = "";
        preencherSelectsTransferencia(origemId);
        document.getElementById("modal-transferir").classList.add("active");
      }
      function fecharModalTransferir() {
        document.getElementById("modal-transferir").classList.remove("active");
      }

      async function salvarTransferencia() {
        const body = {
          conta_origem_id: parseInt(document.getElementById("t-origem").value),
          conta_destino_id: parseInt(
            document.getElementById("t-destino").value,
          ),
          valor: parseFloat(document.getElementById("t-valor").value),
          data: document.getElementById("t-data").value,
          descricao:
            document.getElementById("t-descricao").value ||
            "Transferência entre contas",
          observacao: document.getElementById("t-obs").value || null,
        };
        if (!body.valor || isNaN(body.valor) || body.valor <= 0) {
          toast("Informe um valor válido.", "erro");
          return;
        }
        if (!body.data) {
          toast("Informe a data.", "erro");
          return;
        }
        if (body.conta_origem_id === body.conta_destino_id) {
          toast("Origem e destino devem ser diferentes.", "erro");
          return;
        }
        if (editandoTransferenciaId) {
          await fetchAPI(`/api/transferencias/${editandoTransferenciaId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          toast("Transferência atualizada!");
        } else {
          await fetchAPI("/api/transferencias", {
            method: "POST",
            body: JSON.stringify(body),
          });
          toast("Transferência realizada!");
        }
        fecharModalTransferir();
        carregarContas();
        carregarTransferencias();
      }

      async function editarTransferencia(tid) {
        const data = await fetchAPI(`/api/transferencias/${tid}`);
        if (!data || data.length < 2) return;
        const despesa = data.find((t) => t.tipo === "despesa"),
          receita = data.find((t) => t.tipo === "receita");
        editandoTransferenciaId = tid;
        document.getElementById("modal-transferir-titulo").textContent =
          "Editar transferência";
        document.getElementById("t-valor").value = despesa.valor;
        document.getElementById("t-data").value =
          despesa.data?.split("T")[0] || "";
        document.getElementById("t-descricao").value = despesa.descricao;
        document.getElementById("t-obs").value = despesa.observacao || "";
        preencherSelectsTransferencia();
        document.getElementById("t-origem").value = despesa.conta_id;
        document.getElementById("t-destino").value = receita.conta_id;
        document.getElementById("modal-transferir").classList.add("active");
      }

      async function deletarTransferencia(tid) {
        const ok = await confirmar(
          "Deseja deletar esta transferência? As duas entradas serão removidas.",
        );
        if (!ok) return;
        await fetchAPI(`/api/transferencias/${tid}`, { method: "DELETE" });
        toast("Transferência deletada!", "info");
        carregarContas();
        carregarTransferencias();
      }

      window.addEventListener("resize", carregarTransferencias);

      async function init() {
        await carregarContas();
        await carregarTransferencias();
      }
      init();
    </script>
  </body>
</html>
