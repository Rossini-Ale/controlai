<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controlaí — Lançamentos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      .badge.transferencia {
        background: rgba(99, 102, 241, 0.15);
        color: #6366f1;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 16px;
        "
      >
        <h1 class="page-title" style="margin: 0">Lançamentos</h1>
        <button class="btn" onclick="abrirModal()">
          <i class="fa-solid fa-plus"></i> Novo
        </button>
      </div>

      <div
        class="filtros"
        style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap"
      >
        <select
          id="filtro-mes"
          onchange="carregarTransacoes()"
          style="
            background: var(--bg-secondary);
            border: 0.5px solid var(--border);
            color: var(--text-primary);
            border-radius: 9px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            flex: 1;
          "
        >
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
        <select
          id="filtro-ano"
          onchange="carregarTransacoes()"
          style="
            background: var(--bg-secondary);
            border: 0.5px solid var(--border);
            color: var(--text-primary);
            border-radius: 9px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            flex: 1;
          "
        ></select>
        <select
          id="filtro-tipo"
          onchange="carregarTransacoes()"
          style="
            background: var(--bg-secondary);
            border: 0.5px solid var(--border);
            color: var(--text-primary);
            border-radius: 9px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            flex: 1;
          "
        >
          <option value="">Todos</option>
          <option value="receita">Receitas</option>
          <option value="despesa">Despesas</option>
          <option value="transferencia">Transferências</option>
        </select>
      </div>

      <!-- Desktop -->
      <div class="table-wrap desktop-only">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Conta</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-transacoes-desktop"></tbody>
        </table>
      </div>

      <!-- Mobile -->
      <div id="lista-mobile" class="mobile-only"></div>
    </div>

    <!-- Modal lançamento -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h2 id="modal-titulo">Novo lançamento</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div class="form-group">
            <label>Tipo</label>
            <select id="f-tipo" onchange="filtrarCategorias()">
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valor</label>
            <input
              type="number"
              id="f-valor"
              placeholder="0,00"
              step="0.01"
              min="0"
            />
          </div>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <input
            type="text"
            id="f-descricao"
            placeholder="Ex: Aluguel, Salário..."
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div class="form-group">
            <label>Categoria</label>
            <select id="f-categoria"></select>
          </div>
          <div class="form-group">
            <label>Conta</label>
            <select id="f-conta"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="f-data" />
        </div>
        <div class="form-group">
          <label>Observação (opcional)</label>
          <input type="text" id="f-obs" placeholder="Alguma observação..." />
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button class="btn" onclick="salvar()">Salvar</button>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>

    <script src="/js/global.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML =
        renderSidebar("Lançamentos");
      document.getElementById("tabbar").innerHTML = renderTabBar("Lançamentos");

      let editandoId = null;
      let categorias = [];
      let contas = [];
      const { mes, ano } = getMesAno();

      document.getElementById("filtro-mes").value = mes;
      const selectAno = document.getElementById("filtro-ano");
      for (let a = ano; a >= ano - 3; a--) {
        selectAno.innerHTML += `<option value="${a}">${a}</option>`;
      }
      document.getElementById("f-data").value = new Date()
        .toISOString()
        .split("T")[0];

      function isMobile() {
        return window.innerWidth <= 768;
      }

      // ── Renderização ──
      async function carregarTransacoes() {
        const m = document.getElementById("filtro-mes").value;
        const a = document.getElementById("filtro-ano").value;
        const tipo = document.getElementById("filtro-tipo").value;

        if (isMobile()) {
          document.getElementById("lista-mobile").innerHTML = skeletonLista(3);
        } else {
          document.getElementById("tabela-transacoes-desktop").innerHTML =
            `<tr><td colspan="7" style="text-align:center;padding:24px">${skeletonLista(1)}</td></tr>`;
        }

        // Filtro de transferência é client-side (usa flag is_transferencia)
        let url = `/api/transacoes?mes=${m}&ano=${a}`;
        if (tipo === "receita" || tipo === "despesa") url += `&tipo=${tipo}`;
        let data = await fetchAPI(url);
        if (!data) return;

        // Se filtrou transferências, mostra só as de transferência
        if (tipo === "transferencia") {
          data = data.filter((t) => t.is_transferencia);
        } else if (tipo === "receita" || tipo === "despesa") {
          // Exclui as de transferência dos filtros de receita/despesa puras
          data = data.filter((t) => !t.is_transferencia);
        }
        // "Todos" mostra tudo incluindo transferências

        if (isMobile()) renderMobile(data);
        else renderDesktop(data);
      }

      function tipoLabel(t) {
        if (t.is_transferencia) return "transferencia";
        return t.tipo;
      }

      function tipoTexto(t) {
        if (t.is_transferencia) return "transferência";
        return t.tipo;
      }

      function renderDesktop(data) {
        const tbody = document.getElementById("tabela-transacoes-desktop");
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="padding:0">
            <div style="padding:16px">${emptyState("fa-right-left", "Nenhuma transação", "Nenhuma transação encontrada neste período.", "Novo lançamento", "abrirModal()")}</div>
          </td></tr>`;
          return;
        }
        tbody.innerHTML = data
          .map((t) => {
            const label = tipoLabel(t);
            const isTransf = !!t.is_transferencia;
            return `
            <tr>
              <td>${formatarData(t.data)}</td>
              <td>
                ${isTransf ? `<i class="fa-solid fa-right-left" style="color:#6366f1;margin-right:6px;font-size:11px"></i>` : ""}
                ${t.descricao}
              </td>
              <td>
                ${
                  isTransf
                    ? `<span style="color:var(--text-muted);font-size:12px">—</span>`
                    : `<span style="display:inline-flex;align-items:center;gap:5px">
                      <span style="width:8px;height:8px;border-radius:50%;background:${t.categoria_cor || "#6b7280"}"></span>
                      ${t.categoria_nome || "—"}
                    </span>`
                }
              </td>
              <td>${t.conta_nome || "—"}</td>
              <td><span class="badge ${label}">${tipoTexto(t)}</span></td>
              <td><span class="badge ${label}">${formatarMoeda(t.valor)}</span></td>
              <td>
                ${
                  isTransf
                    ? `<button class="btn-danger" onclick="deletarTransferencia('${t.transferencia_id}')">
                       <i class="fa-solid fa-trash"></i>
                     </button>`
                    : `<button class="btn-edit" onclick="editar(${t.id})"><i class="fa-solid fa-pen"></i></button>
                     <button class="btn-danger" onclick="deletar(${t.id})"><i class="fa-solid fa-trash"></i></button>`
                }
              </td>
            </tr>
          `;
          })
          .join("");
      }

      function renderMobile(data) {
        const lista = document.getElementById("lista-mobile");
        if (data.length === 0) {
          lista.innerHTML = emptyState(
            "fa-right-left",
            "Nenhuma transação",
            "Nenhuma transação encontrada neste período.",
            "Novo lançamento",
            "abrirModal()",
          );
          return;
        }
        lista.innerHTML = data
          .map((t) => {
            const isTransf = !!t.is_transferencia;
            const corBorda = isTransf
              ? "#6366f1"
              : t.tipo === "receita"
                ? "var(--green)"
                : "var(--red)";
            const corValor = isTransf
              ? "#6366f1"
              : t.tipo === "receita"
                ? "var(--green)"
                : "var(--red)";
            const sinal = isTransf ? "" : t.tipo === "receita" ? "+" : "-";

            return `
            <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;border-left:3px solid ${corBorda}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
                <div style="flex:1;margin-right:8px">
                  <div style="font-size:15px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px">
                    ${isTransf ? `<i class="fa-solid fa-right-left" style="color:#6366f1;font-size:11px"></i>` : ""}
                    ${t.descricao}
                  </div>
                  <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span>${formatarData(t.data)}</span>
                    ${
                      !isTransf && t.categoria_nome
                        ? `
                      <span>·</span>
                      <span style="display:inline-flex;align-items:center;gap:4px">
                        <span style="width:7px;height:7px;border-radius:50%;background:${t.categoria_cor || "#6b7280"}"></span>
                        ${t.categoria_nome}
                      </span>`
                        : ""
                    }
                    ${t.conta_nome ? `<span>·</span><span>${t.conta_nome}</span>` : ""}
                  </div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:16px;font-weight:700;color:${corValor}">${sinal}${formatarMoeda(t.valor)}</div>
                </div>
              </div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                ${
                  isTransf
                    ? `<button class="btn-danger" style="padding:6px 14px;font-size:12px" onclick="deletarTransferencia('${t.transferencia_id}')">
                       <i class="fa-solid fa-trash"></i>
                     </button>`
                    : `<button class="btn-edit" onclick="editar(${t.id})" style="padding:6px 14px;font-size:12px"><i class="fa-solid fa-pen"></i> Editar</button>
                     <button class="btn-danger" onclick="deletar(${t.id})" style="padding:6px 14px;font-size:12px"><i class="fa-solid fa-trash"></i></button>`
                }
              </div>
            </div>
          `;
          })
          .join("");
      }

      // ── Categorias / Contas ──
      async function carregarCategorias() {
        categorias = (await fetchAPI("/api/categorias")) || [];
        filtrarCategorias();
      }

      function filtrarCategorias() {
        const tipo = document.getElementById("f-tipo").value;
        const select = document.getElementById("f-categoria");
        const filtradas = categorias.filter((c) => c.tipo === tipo);
        select.innerHTML = filtradas.length
          ? filtradas
              .map((c) => `<option value="${c.id}">${c.nome}</option>`)
              .join("")
          : `<option value="">Sem categorias</option>`;
      }

      async function carregarContas() {
        contas = (await fetchAPI("/api/contas")) || [];
        const select = document.getElementById("f-conta");
        select.innerHTML = contas.length
          ? contas
              .map((c) => `<option value="${c.id}">${c.nome}</option>`)
              .join("")
          : `<option value="">Sem contas</option>`;
      }

      // ── Modal lançamento ──
      function abrirModal() {
        editandoId = null;
        document.getElementById("modal-titulo").textContent = "Novo lançamento";
        document.getElementById("f-tipo").value = "despesa";
        document.getElementById("f-valor").value = "";
        document.getElementById("f-descricao").value = "";
        document.getElementById("f-data").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("f-obs").value = "";
        filtrarCategorias();
        document.getElementById("modal").classList.add("active");
      }

      function fecharModal() {
        document.getElementById("modal").classList.remove("active");
      }

      async function editar(id) {
        const todos = (await fetchAPI("/api/transacoes")) || [];
        const item = todos.find((x) => x.id === id);
        if (!item) return;
        editandoId = id;
        document.getElementById("modal-titulo").textContent =
          "Editar lançamento";
        document.getElementById("f-tipo").value = item.tipo;
        document.getElementById("f-valor").value = item.valor;
        document.getElementById("f-descricao").value = item.descricao;
        document.getElementById("f-data").value =
          item.data?.split("T")[0] || "";
        document.getElementById("f-obs").value = item.observacao || "";
        filtrarCategorias();
        document.getElementById("f-categoria").value = item.categoria_id;
        document.getElementById("f-conta").value = item.conta_id;
        document.getElementById("modal").classList.add("active");
      }

      async function salvar() {
        const body = {
          tipo: document.getElementById("f-tipo").value,
          valor: parseFloat(document.getElementById("f-valor").value),
          descricao: document.getElementById("f-descricao").value,
          categoria_id: document.getElementById("f-categoria").value,
          conta_id: document.getElementById("f-conta").value,
          data: document.getElementById("f-data").value,
          observacao: document.getElementById("f-obs").value,
        };
        if (!body.descricao || !body.valor || !body.data) {
          toast("Preencha descrição, valor e data.", "erro");
          return;
        }
        if (editandoId) {
          await fetchAPI(`/api/transacoes/${editandoId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          toast("Lançamento atualizado!");
        } else {
          await fetchAPI("/api/transacoes", {
            method: "POST",
            body: JSON.stringify(body),
          });
          toast("Lançamento criado!");
        }
        fecharModal();
        carregarTransacoes();
      }

      async function deletar(id) {
        const ok = await confirmar(
          "Deseja deletar este lançamento? Esta ação não pode ser desfeita.",
        );
        if (!ok) return;
        await fetchAPI(`/api/transacoes/${id}`, { method: "DELETE" });
        toast("Lançamento deletado!", "info");
        carregarTransacoes();
      }

      async function deletarTransferencia(transferencia_id) {
        const ok = await confirmar(
          "Deseja deletar esta transferência? As duas entradas (origem e destino) serão removidas.",
        );
        if (!ok) return;
        await fetchAPI(`/api/transferencias/${transferencia_id}`, {
          method: "DELETE",
        });
        toast("Transferência deletada!", "info");
        carregarTransacoes();
      }

      function ajustarLayout() {
        const desktopTable = document.querySelector(".desktop-only");
        const mobileLista = document.getElementById("lista-mobile");
        if (isMobile()) {
          desktopTable.style.display = "none";
          mobileLista.style.display = "block";
        } else {
          desktopTable.style.display = "block";
          mobileLista.style.display = "none";
        }
      }

      window.addEventListener("resize", () => {
        ajustarLayout();
        carregarTransacoes();
      });

      carregarCategorias();
      carregarContas();
      ajustarLayout();
      carregarTransacoes();
    </script>
  </body>
</html>
