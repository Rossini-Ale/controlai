<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controlaí — Metas</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      .metas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .meta-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .meta-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .meta-nome {
        font-size: 16px;
        font-weight: 600;
      }
      .meta-status {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 500;
      }
      .meta-status.ativa {
        background: rgba(59, 130, 246, 0.15);
        color: var(--blue);
      }
      .meta-status.concluida {
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
      }
      .meta-status.cancelada {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .meta-valores {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .meta-valores span {
        font-weight: 600;
        color: var(--text-primary);
      }
      .progress-bar {
        background: var(--bg-tertiary);
        border-radius: 99px;
        height: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 99px;
        background: var(--green);
        transition: width 0.4s ease;
      }
      .meta-prazo {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 14px;
      }
      .meta-acoes {
        display: flex;
        gap: 8px;
      }
      .btn-progresso {
        background: rgba(16, 185, 129, 0.1);
        border: 0.5px solid var(--green);
        color: var(--green);
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-progresso:hover {
        background: var(--green);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 24px;
        "
      >
        <h1 class="page-title" style="margin: 0">Metas</h1>
        <button class="btn" onclick="abrirModal()">
          <i class="fa-solid fa-plus"></i> Nova meta
        </button>
      </div>

      <div class="metas-grid" id="metas-grid">
        <p style="color: var(--text-muted)">Carregando...</p>
      </div>
    </div>

    <!-- Modal nova/editar meta -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h2 id="modal-titulo">Nova meta</h2>
        <div class="form-group">
          <label>Nome da meta</label>
          <input
            type="text"
            id="f-nome"
            placeholder="Ex: Viagem, Reserva de emergência..."
          />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div class="form-group">
            <label>Valor alvo</label>
            <input type="number" id="f-alvo" placeholder="0,00" step="0.01" />
          </div>
          <div class="form-group">
            <label>Valor atual</label>
            <input type="number" id="f-atual" placeholder="0,00" step="0.01" />
          </div>
        </div>
        <div class="form-group">
          <label>Prazo</label>
          <input type="date" id="f-prazo" />
        </div>
        <div class="form-group" id="grupo-status" style="display: none">
          <label>Status</label>
          <select id="f-status">
            <option value="ativa">Ativa</option>
            <option value="concluida">Concluída</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button class="btn" onclick="salvar()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- Modal atualizar progresso -->
    <div class="modal-overlay" id="modal-progresso">
      <div class="modal">
        <h2>Atualizar progresso</h2>
        <div class="form-group">
          <label>Valor atual</label>
          <input type="number" id="p-atual" placeholder="0,00" step="0.01" />
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModalProgresso()">
            Cancelar
          </button>
          <button class="btn" onclick="salvarProgresso()">Atualizar</button>
        </div>
      </div>
    </div>

    <script src="/js/global.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML = renderSidebar("Metas");

      let editandoId = null;
      let progressoId = null;

      async function carregarMetas() {
        const metas = (await fetchAPI("/api/metas")) || [];
        const grid = document.getElementById("metas-grid");

        if (metas.length === 0) {
          grid.innerHTML = `<p style="color:var(--text-muted)">Nenhuma meta cadastrada.</p>`;
          return;
        }

        grid.innerHTML = metas
          .map((m) => {
            const alvo = parseFloat(m.valor_alvo) || 0;
            const atual = parseFloat(m.valor_atual) || 0;
            const pct = alvo > 0 ? Math.min((atual / alvo) * 100, 100) : 0;
            const cor =
              pct >= 100
                ? "var(--green)"
                : pct >= 50
                  ? "var(--blue)"
                  : "#f59e0b";

            return `
        <div class="meta-card">
          <div class="meta-header">
            <div class="meta-nome">${m.nome}</div>
            <span class="meta-status ${m.status}">${m.status}</span>
          </div>
          <div class="meta-valores">
            <div>Atual: <span>${formatarMoeda(atual)}</span></div>
            <div>Meta: <span>${formatarMoeda(alvo)}</span></div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${cor}"></div>
          </div>
          <div class="meta-prazo">
            <i class="fa-solid fa-calendar" style="margin-right:4px"></i>
            Prazo: ${formatarData(m.prazo)} &nbsp;·&nbsp; ${pct.toFixed(0)}% concluído
          </div>
          <div class="meta-acoes">
            <button class="btn-progresso" onclick="abrirProgresso(${m.id}, ${atual})">
              <i class="fa-solid fa-arrow-up"></i> Progresso
            </button>
            <button class="btn-edit" onclick="editar(${m.id}, '${m.nome}', ${alvo}, ${atual}, '${m.prazo?.split("T")[0] || ""}', '${m.status}')">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button class="btn-danger" onclick="deletar(${m.id})">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `;
          })
          .join("");
      }

      function abrirModal() {
        editandoId = null;
        document.getElementById("modal-titulo").textContent = "Nova meta";
        document.getElementById("f-nome").value = "";
        document.getElementById("f-alvo").value = "";
        document.getElementById("f-atual").value = "0";
        document.getElementById("f-prazo").value = "";
        document.getElementById("grupo-status").style.display = "none";
        document.getElementById("modal").classList.add("active");
      }

      function fecharModal() {
        document.getElementById("modal").classList.remove("active");
      }

      function editar(id, nome, alvo, atual, prazo, status) {
        editandoId = id;
        document.getElementById("modal-titulo").textContent = "Editar meta";
        document.getElementById("f-nome").value = nome;
        document.getElementById("f-alvo").value = alvo;
        document.getElementById("f-atual").value = atual;
        document.getElementById("f-prazo").value = prazo;
        document.getElementById("f-status").value = status;
        document.getElementById("grupo-status").style.display = "block";
        document.getElementById("modal").classList.add("active");
      }

      async function salvar() {
        const body = {
          nome: document.getElementById("f-nome").value,
          valor_alvo: parseFloat(document.getElementById("f-alvo").value) || 0,
          valor_atual:
            parseFloat(document.getElementById("f-atual").value) || 0,
          prazo: document.getElementById("f-prazo").value,
          status: document.getElementById("f-status").value || "ativa",
        };
        if (!body.nome || !body.valor_alvo) {
          alert("Informe o nome e o valor alvo.");
          return;
        }
        if (editandoId) {
          await fetchAPI(`/api/metas/${editandoId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
        } else {
          await fetchAPI("/api/metas", {
            method: "POST",
            body: JSON.stringify(body),
          });
        }
        fecharModal();
        carregarMetas();
      }

      function abrirProgresso(id, atual) {
        progressoId = id;
        document.getElementById("p-atual").value = atual;
        document.getElementById("modal-progresso").classList.add("active");
      }

      function fecharModalProgresso() {
        document.getElementById("modal-progresso").classList.remove("active");
      }

      async function salvarProgresso() {
        const valor_atual =
          parseFloat(document.getElementById("p-atual").value) || 0;
        await fetchAPI(`/api/metas/${progressoId}/progresso`, {
          method: "PATCH",
          body: JSON.stringify({ valor_atual }),
        });
        fecharModalProgresso();
        carregarMetas();
      }

      async function deletar(id) {
        if (!confirm("Deletar esta meta?")) return;
        await fetchAPI(`/api/metas/${id}`, { method: "DELETE" });
        carregarMetas();
      }

      carregarMetas();
    </script>
  </body>
</html>
