<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controlaí — Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f1117;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #1a1f2e;
        border: 0.5px solid #2d3748;
        border-radius: 20px;
        padding: 40px 36px;
        width: 100%;
        max-width: 380px;
        animation: fadeUp 0.4s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
        background: #10b981;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
      }

      .logo-icon i {
        font-size: 24px;
        color: #fff;
      }

      .logo h1 {
        font-size: 22px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
      }

      .logo p {
        font-size: 13px;
        color: #6b7280;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input {
        width: 100%;
        background: #0f1117;
        border: 0.5px solid #2d3748;
        border-radius: 10px;
        padding: 12px 14px;
        color: #fff;
        font-size: 14px;
        transition: border-color 0.2s;
        outline: none;
      }

      .form-group input:focus {
        border-color: #10b981;
      }

      .btn {
        width: 100%;
        background: #10b981;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .btn:hover {
        background: #059669;
      }
      .btn:active {
        transform: scale(0.98);
      }

      .erro {
        background: #2d1515;
        border: 0.5px solid #7f1d1d;
        color: #fca5a5;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-top: 12px;
        display: none;
      }

      .toggle {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #6b7280;
      }

      .toggle a {
        color: #10b981;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
      }

      .toggle a:hover {
        text-decoration: underline;
      }

      .cadastro-form {
        display: none;
        flex-direction: column;
        gap: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <h1>controlaí</h1>
        <p>Controle financeiro pessoal</p>
      </div>

      <!-- Login -->
      <div id="login-form">
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" id="login-username" placeholder="seu_usuario" />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="login()">Entrar</button>
        <div class="erro" id="login-erro"></div>
        <div class="toggle">
          Não tem conta? <a onclick="toggleForm()">Cadastre-se</a>
        </div>
      </div>

      <!-- Cadastro -->
      <div id="cadastro-form" class="cadastro-form">
        <div class="form-group">
          <label>Nome completo</label>
          <input type="text" id="cad-nome" placeholder="Seu nome" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="cad-email" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" id="cad-username" placeholder="seu_usuario" />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="cad-senha" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="cadastrar()">Criar conta</button>
        <div class="erro" id="cad-erro"></div>
        <div class="toggle">
          Já tem conta? <a onclick="toggleForm()">Fazer login</a>
        </div>
      </div>
    </div>

    <script>
      const API = "";

      function toggleForm() {
        const login = document.getElementById("login-form");
        const cad = document.getElementById("cadastro-form");
        const loginVisivel = login.style.display !== "none";

        if (loginVisivel) {
          login.style.display = "none";
          cad.style.display = "block";
        } else {
          login.style.display = "block";
          cad.style.display = "none";
        }
      }

      async function login() {
        const username = document.getElementById("login-username").value;
        const senha = document.getElementById("login-senha").value;
        const erro = document.getElementById("login-erro");

        try {
          const res = await fetch(`${API}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, senha }),
          });
          const data = await res.json();
          if (!res.ok) {
            erro.style.display = "block";
            erro.textContent = data.erro;
            return;
          }
          localStorage.clear();
          localStorage.setItem("controlai_token", data.token);
          localStorage.setItem("controlai_nome", data.nome);
          localStorage.setItem("controlai_username", data.username);
          window.location.href = "/dashboard.html";
        } catch {
          erro.style.display = "block";
          erro.textContent = "Erro ao conectar ao servidor.";
        }
      }

      async function cadastrar() {
        const nome = document.getElementById("cad-nome").value;
        const email = document.getElementById("cad-email").value;
        const username = document.getElementById("cad-username").value;
        const senha = document.getElementById("cad-senha").value;
        const erro = document.getElementById("cad-erro");

        try {
          const res = await fetch(`${API}/api/auth/cadastro`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, email, username, senha }),
          });
          const data = await res.json();
          if (!res.ok) {
            erro.style.display = "block";
            erro.textContent = data.erro;
            return;
          }
          alert("Conta criada! Faça login.");
          toggleForm();
        } catch {
          erro.style.display = "block";
          erro.textContent = "Erro ao conectar ao servidor.";
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const loginVisible =
            document.getElementById("login-form").style.display !== "none";
          loginVisible ? login() : cadastrar();
        }
      });
    </script>
  </body>
</html>
