<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Controlaí — Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
      .mes-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        padding-top: 4px;
      }
      .mes-nav button {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .mes-nav button:hover {
        background: var(--bg-tertiary);
      }
      .mes-nav span {
        font-size: 15px;
        font-weight: 600;
        min-width: 140px;
        text-align: center;
      }

      /* Busca */
      .busca-wrap {
        position: relative;
        margin-bottom: 20px;
      }
      .busca-input {
        width: 100%;
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px 10px 38px;
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .busca-input:focus {
        border-color: var(--green);
      }
      .busca-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 14px;
        pointer-events: none;
      }
      .busca-clear {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 14px;
        display: none;
      }

      /* Orçamento */
      .orc-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      .orc-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .orc-card-header h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .orc-valores {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .orc-valores strong {
        color: var(--text-primary);
      }
      .orc-bar {
        background: var(--bg-tertiary);
        border-radius: 99px;
        height: 8px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .orc-fill {
        height: 100%;
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      .orc-pct {
        font-size: 12px;
        color: var(--text-muted);
        text-align: right;
      }

      /* Saldo previsto */
      .previsto-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }

      /* Gráfico rosca */
      .charts-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }
      .chart-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }
      .chart-card h3 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
      }

      /* Checklist */
      .checklist-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 6px;
        transition: background 0.15s;
      }
      .checklist-item.feito {
        background: var(--bg-tertiary);
      }
      .checklist-item.pendente {
        background: var(--bg-primary);
        border: 0.5px solid var(--border);
      }
      .checklist-circulo {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 11px;
      }

      /* Transações mobile */
      .tx-mobile {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .tx-mobile-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 14px;
      }
      .tx-mobile-info {
        flex: 1;
      }
      .tx-mobile-desc {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .tx-mobile-meta {
        font-size: 11px;
        color: var(--text-muted);
      }
      .tx-mobile-valor {
        font-size: 15px;
        font-weight: 700;
      }

      @media (max-width: 768px) {
        .charts-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="mobileheader"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="mes-nav">
        <button onclick="mudarMes(-1)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="mes-label"></span>
        <button onclick="mudarMes(1)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Busca -->
      <div class="busca-wrap">
        <i class="fa-solid fa-magnifying-glass busca-icon"></i>
        <input
          type="text"
          class="busca-input"
          id="busca-input"
          placeholder="Buscar lançamentos..."
          oninput="buscarTransacoes(this.value)"
        />
        <button class="busca-clear" id="busca-clear" onclick="limparBusca()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Resultado da busca -->
      <div
        id="busca-resultado"
        style="display: none; margin-bottom: 20px"
      ></div>

      <div id="checklist-wrap"></div>
      <div id="alertas-orcamento"></div>
      <div id="metas-wrap"></div>
      <div class="cards-grid" id="cards-resumo"></div>

      <!-- Insight variação mensal -->
      <div id="insight-variacao"></div>

      <!-- Gráficos -->
      <div class="charts-row" id="charts-row" style="display: none">
        <div class="chart-card">
          <h3>Despesas por categoria <span style="font-size:11px;color:var(--text-muted);font-weight:400;margin-left:4px">clique para detalhar</span></h3>
          <canvas id="chart-categorias" height="180" style="cursor:pointer"></canvas>
        </div>
        <div class="chart-card">
          <h3>Saldo previsto no fim do mês</h3>
          <div id="saldo-previsto-wrap" style="padding-top: 8px"></div>
        </div>
      </div>

      <!-- Gráfico de barras — evolução 6 meses -->
      <div id="grafico-6meses" style="margin-bottom:20px"></div>

      <!-- Gráfico de linha — saldo dia a dia -->
      <div id="saldo-diario-wrap"></div>

      <div id="orc-wrap"></div>
      <div id="rec-vencendo-wrap"></div>
      <div id="pets-widget"></div>

      <div style="margin-top: 20px">
        <div class="table-wrap">
          <div class="table-header">
            <h2>Últimas transações</h2>
            <a href="/lancamentos.html" class="btn"
              ><i class="fa-solid fa-plus"></i> Nova</a
            >
          </div>
          <div id="lista-desktop" class="desktop-only">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Descrição</th>
                  <th>Categoria</th>
                  <th>Valor</th>
                </tr>
              </thead>
              <tbody id="tbody-transacoes"></tbody>
            </table>
          </div>
          <div
            id="lista-mobile"
            class="mobile-only"
            style="padding: 12px"
          ></div>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>
    <script src="/js/storage.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/global.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML = renderSidebar("Dashboard");
      document.getElementById("mobileheader").innerHTML =
        renderMobileHeader("Dashboard");
      document.getElementById("tabbar").innerHTML = renderTabBar("Dashboard");

      let { mes, ano } = getMesAno();
      let todasTransacoes = [];
      let chartCategorias = null, chart6Meses = null;
      let _resumoData = null, _evolucaoData = null;

      function atualizarLabel() {
        document.getElementById("mes-label").textContent =
          `${nomeMes(mes)} ${ano}`;
      }

      function mudarMes(delta) {
        mes += delta;
        if (mes > 12) {
          mes = 1;
          ano++;
        }
        if (mes < 1) {
          mes = 12;
          ano--;
        }
        atualizarLabel();
        carregarDados();
      }

      async function carregarDados() {
        _resumoData = null;
        _evolucaoData = null;
        document.getElementById("cards-resumo").innerHTML = skeletonCards(4);
        document.getElementById("insight-variacao").innerHTML = "";
        document.getElementById("grafico-6meses").innerHTML =
          `<div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">${skeletonCards(2)}</div>`;
        document.getElementById("orc-wrap").innerHTML =
          `<div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px">${skeletonCards(1)}</div>`;
        document.getElementById("saldo-previsto-wrap").innerHTML = skeletonCards(1);
        document.getElementById("rec-vencendo-wrap").innerHTML =
          `<div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">${skeletonLista(2)}</div>`;
        document.getElementById("saldo-diario-wrap").innerHTML = "";
        await Promise.all([
          carregarResumo(),
          carregarTransacoes(),
          carregarOrcamento(),
          carregarRecorrentesVencendo(),
          carregarSaldoTotal(),
          carregarGrafico6Meses(),
          carregarSaldoDiario(),
          carregarMetas(),
        ]);
        _renderInsight(_evolucaoData, _resumoData);
      }

      async function carregarSaldoTotal() {
        const contas = await fetchAPI("/api/relatorios/saldo-contas");
        if (!Array.isArray(contas)) return;
        const total = contas.reduce((s, c) => s + parseFloat(c.saldo_atual || 0), 0);
        const el = document.getElementById("saldo-total-valor");
        if (!el) return;
        el.className = "card-value " + (total >= 0 ? "green" : "red");
        aplicarPrivacidade();
        countUp(el, total);
      }

      async function carregarResumo() {
        const mesAnt = mes === 1 ? 12 : mes - 1;
        const anoAnt = mes === 1 ? ano - 1 : ano;
        const [data, ant] = await Promise.all([
          fetchAPI(`/api/relatorios/resumo?mes=${mes}&ano=${ano}`),
          fetchAPI(`/api/relatorios/resumo?mes=${mesAnt}&ano=${anoAnt}`),
        ]);
        _resumoData = data;
        if (!data) return;

        function cmp(atual, prev, inverso = false) {
          const a = parseFloat(atual) || 0, p = parseFloat(prev) || 0;
          if (!p) return "";
          const d = ((a - p) / Math.abs(p)) * 100;
          const positivo = inverso ? d < 0 : d > 0;
          const cor = positivo ? "var(--green)" : "var(--red)";
          return `<div style="font-size:10px;color:${cor};margin-top:3px">${d > 0 ? "+" : ""}${d.toFixed(0)}% vs mês ant.</div>`;
        }

        document.getElementById("cards-resumo").innerHTML = `
          <div class="card">
            <div class="card-label">Receitas</div>
            <div class="card-value green" id="cv-receitas">—</div>
            ${ant ? cmp(data.total_receitas, ant.total_receitas) : ""}
          </div>
          <div class="card">
            <div class="card-label">Despesas</div>
            <div class="card-value red" id="cv-despesas">—</div>
            ${ant ? cmp(data.total_despesas, ant.total_despesas, true) : ""}
          </div>
          <div class="card">
            <div class="card-label">Saldo do mês</div>
            <div class="card-value ${parseFloat(data.saldo) >= 0 ? "green" : "red"}" id="cv-saldo">—</div>
            ${ant ? cmp(data.saldo, ant.saldo) : ""}
          </div>
          <div class="card" id="card-saldo-total">
            <div class="card-label">Saldo total</div>
            <div class="card-value" id="saldo-total-valor" style="color:var(--text-muted)">—</div>
          </div>`;
        aplicarPrivacidade();
        requestAnimationFrame(() => {
          countUp(document.getElementById("cv-receitas"), parseFloat(data.total_receitas) || 0);
          countUp(document.getElementById("cv-despesas"), parseFloat(data.total_despesas) || 0);
          countUp(document.getElementById("cv-saldo"), parseFloat(data.saldo) || 0);
        });
      }

      async function carregarTransacoes() {
        const res = await fetchAPI(
          `/api/transacoes?mes=${mes}&ano=${ano}&limit=100`,
        );
        todasTransacoes = Array.isArray(res) ? res : res?.data || [];

        const recentes = todasTransacoes.slice(0, 8);
        renderTransacoesDesktop(recentes);
        renderTransacoesMobile(recentes);

        // Carrega gráfico e saldo previsto em paralelo
        carregarGraficoCategorias();
        carregarSaldoPrevisto();
      }

      async function carregarGraficoCategorias() {
        const { m, a } = { m: mes, a: ano };
        const data = await fetchAPI(
          `/api/relatorios/por-categoria?mes=${m}&ano=${a}&tipo=despesa`,
        );
        if (!data || data.length === 0) {
          document.getElementById("charts-row").style.display = "none";
          return;
        }
        document.getElementById("charts-row").style.display = "grid";

        const top5 = data.slice(0, 5);
        const labels = top5.map((d) => d.nome || "Outros");
        const valores = top5.map((d) => parseFloat(d.total) || 0);
        const cores = top5.map((d) => d.cor || "#6b7280");

        if (chartCategorias) chartCategorias.destroy();
        chartCategorias = new Chart(
          document.getElementById("chart-categorias"),
          {
            type: "doughnut",
            data: {
              labels,
              datasets: [
                {
                  data: valores,
                  backgroundColor: cores,
                  borderWidth: 0,
                  hoverOffset: 4,
                },
              ],
            },
            options: {
              responsive: true,
              cutout: "65%",
              plugins: {
                legend: {
                  position: "bottom",
                  labels: {
                    color:
                      getComputedStyle(document.documentElement)
                        .getPropertyValue("--text-muted")
                        .trim() || "#6b7280",
                    font: { size: 11 },
                    padding: 10,
                    boxWidth: 10,
                  },
                },
                tooltip: {
                  callbacks: {
                    label: (ctx) => ` ${formatarMoedaRaw(ctx.parsed)}`,
                  },
                },
              },
              onClick: (_, elements) => {
                if (!elements.length) return;
                abrirModalCategoria(top5[elements[0].index]);
              },
            },
          },
        );
      }

      async function abrirModalCategoria(cat) {
        const modal = document.getElementById("modal-categoria");
        const titulo = document.getElementById("modal-cat-titulo");
        const lista = document.getElementById("modal-cat-lista");
        titulo.textContent = cat.nome;
        lista.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</div>`;
        modal.style.display = "flex";

        const data = await fetchAPI(
          `/api/transacoes?mes=${mes}&ano=${ano}&categoria_id=${cat.id}&limit=50`,
        );
        const transacoes = data?.data || [];
        if (!transacoes.length) {
          lista.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center">Nenhuma transação encontrada.</div>`;
          return;
        }
        lista.innerHTML = transacoes.map((t) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)">
            <div>
              <div style="font-size:13px;font-weight:500">${t.descricao}</div>
              <div style="font-size:11px;color:var(--text-muted)">${new Date(t.data).toLocaleDateString("pt-BR")}</div>
            </div>
            <div style="font-size:14px;font-weight:600;color:var(--red)">${formatarMoeda(t.valor)}</div>
          </div>`).join("");
      }

      function _renderAlertasOrcamento(data) {
        if (!data) return;
        const alertas = [];
        if (data.geral) {
          const pct = data.geral.limite > 0
            ? (parseFloat(data.geral.gasto_total) / parseFloat(data.geral.limite)) * 100
            : 0;
          if (pct >= 80) alertas.push({ nome: "Orçamento geral", pct, cor: "#10b981" });
        }
        (data.categorias || []).forEach((c) => {
          const pct = c.limite > 0 ? (parseFloat(c.gasto_atual) / parseFloat(c.limite)) * 100 : 0;
          if (pct >= 80) alertas.push({ nome: c.categoria_nome, pct, cor: c.categoria_cor, icone: c.categoria_icone });
        });
        if (!alertas.length) return;
        const wrap = document.getElementById("alertas-orcamento");
        wrap.innerHTML = `
          <div style="background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 16px;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;font-size:13px"></i>
              <span style="font-size:13px;font-weight:600">Alertas de orçamento</span>
              <a href="/relatorios.html?aba=orcamento" style="font-size:11px;color:var(--green);text-decoration:none;margin-left:auto">Ver detalhes →</a>
            </div>
            ${alertas.map((a) => `
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                ${a.icone ? `<i class="fa-solid ${a.icone}" style="font-size:11px;color:${a.cor};width:14px"></i>` : ""}
                <span style="font-size:12px;flex:1">${a.nome}</span>
                <span style="font-size:12px;font-weight:600;color:${a.pct >= 100 ? "#ef4444" : "#f59e0b"}">${a.pct.toFixed(0)}%</span>
              </div>`).join("")}
          </div>`;
      }

      async function carregarSaldoPrevisto() {
        const wrap = document.getElementById("saldo-previsto-wrap");
        const hoje = new Date();
        const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        const diasRestantes = diasNoMes - hoje.getDate();

        // Usa o endpoint de fluxo que já projeta datas exatas das recorrentes
        const [fluxo, resumo] = await Promise.all([
          fetchAPI(`/api/relatorios/fluxo?dias=${diasRestantes}`),
          fetchAPI(`/api/relatorios/resumo?mes=${mes}&ano=${ano}`),
        ]);

        const saldoAtual = parseFloat(resumo?.saldo) || 0;

        if (!fluxo?.timeline?.length) {
          wrap.innerHTML = `<div style="text-align:center;padding:16px 0;font-size:13px;color:var(--text-muted)">Sem previsão disponível.</div>`;
          return;
        }

        // Soma entradas e saídas projetadas
        let receitasPrevistas = 0, despesasPrevistas = 0;
        fluxo.timeline.forEach((d) => {
          receitasPrevistas += d.entradas || 0;
          despesasPrevistas += d.saidas || 0;
        });

        // Último item da timeline = saldo projetado no fim do mês
        const saldoPrevisto = fluxo.timeline[fluxo.timeline.length - 1].saldo;
        const cor = saldoPrevisto >= 0 ? "var(--green)" : "var(--red)";

        wrap.innerHTML = `
          <div style="text-align:center;padding:8px 0">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Saldo atual</div>
            <div style="font-size:18px;font-weight:700;margin-bottom:12px">${formatarMoeda(saldoAtual)}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">+ projeção (${diasRestantes} dias)</div>
            <div style="display:flex;justify-content:center;gap:16px;font-size:12px;margin-bottom:12px">
              <span style="color:var(--green)">+${formatarMoeda(receitasPrevistas)}</span>
              <span style="color:var(--red)">-${formatarMoeda(despesasPrevistas)}</span>
            </div>
            <div style="border-top:0.5px solid var(--border);padding-top:10px">
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Previsão fim do mês</div>
              <div style="font-size:22px;font-weight:700;color:${cor}">${formatarMoeda(saldoPrevisto)}</div>
            </div>
          </div>`;
      }

      function renderTransacoesDesktop(data) {
        const tbody = document.getElementById("tbody-transacoes");
        if (!tbody) return;
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="padding:0"><div style="padding:16px">${emptyState("fa-right-left", "Nenhuma transação", "Nenhum lançamento neste mês.", "Novo lançamento", "window.location.href='/lancamentos.html'")}</div></td></tr>`;
          return;
        }
        tbody.innerHTML = data
          .map(
            (t) => `
          <tr>
            <td>${formatarData(t.data)}</td>
            <td>${t.is_transferencia ? `<i class="fa-solid fa-right-left" style="color:#6366f1;margin-right:6px;font-size:11px"></i>` : ""}${t.descricao}</td>
            <td><span style="display:inline-flex;align-items:center;gap:6px">
              <span style="width:24px;height:24px;border-radius:50%;background:${t.categoria_cor ? t.categoria_cor + "22" : "var(--bg-tertiary)"};display:inline-flex;align-items:center;justify-content:center">

      // ── Busca global em tempo real (varre histórico completo) ──
      let buscaTimer = null;

      async function buscarTransacoes(q) {
        const clear = document.getElementById("busca-clear");
        const resultDiv = document.getElementById("busca-resultado");
        clear.style.display = q ? "block" : "none";

        clearTimeout(buscaTimer);
        if (!q.trim()) {
          resultDiv.style.display = "none";
          return;
        }

        buscaTimer = setTimeout(async () => {
          const termo = q.toLowerCase().trim();
          if (q.trim().length < 2) { resultDiv.style.display = "none"; return; }

          resultDiv.style.display = "block";
          resultDiv.innerHTML = `<div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:12px;padding:16px;text-align:center;color:var(--text-muted);font-size:13px"><i class="fa-solid fa-spinner fa-spin"></i> Buscando...</div>`;

          const filtradas = await fetchAPI(`/api/transacoes/buscar?q=${encodeURIComponent(q.trim())}`) || [];

          resultDiv.style.display = "block";
          if (filtradas.length === 0) {
            resultDiv.innerHTML = `
              <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--text-muted);font-size:13px">
                <i class="fa-solid fa-magnifying-glass" style="font-size:20px;margin-bottom:8px;display:block"></i>
                Nenhum resultado para "${q}"
              </div>`;
            return;
          }

          resultDiv.innerHTML = `
            <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:12px;overflow:hidden">
              <div style="padding:10px 14px;border-bottom:0.5px solid var(--border);font-size:12px;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between">
                <span>${filtradas.length} resultado(s) para "<strong style="color:var(--text-primary)">${q}</strong>"</span>
                <span style="font-size:11px;color:var(--blue)"><i class="fa-solid fa-globe" style="margin-right:4px"></i>Histórico completo</span>
              </div>
              ${filtradas
                .slice(0, 10)
                .map((t) => {
                  const isT = !!t.is_transferencia;
                  const cor = isT
                    ? "#6366f1"
                    : t.tipo === "receita"
                      ? "var(--green)"
                      : "var(--red)";
                  const sinal = isT ? "" : t.tipo === "receita" ? "+" : "-";
                  // Highlight no texto
                  const descHighlight = highlightTermo(t.descricao, termo);
                  const catHighlight = highlightTermo(t.categoria_nome, termo);
                  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border)">
                  <div>
                    <div style="font-size:14px;font-weight:600;margin-bottom:2px">${descHighlight}</div>
                    <div style="font-size:11px;color:var(--text-muted)">${formatarData(t.data)} · ${catHighlight || "—"}</div>
                  </div>
                  <div style="font-size:14px;font-weight:700;color:${cor}">${sinal}${formatarMoeda(t.valor)}</div>
                </div>`;
                })
                .join("")}
              ${filtradas.length > 10 ? `<div style="padding:10px 14px;font-size:12px;color:var(--text-muted);text-align:center">+ ${filtradas.length - 10} mais → <a href="/lancamentos.html" style="color:var(--green)">ver todos</a></div>` : ""}
            </div>`;
        }, 200);
      }

      function limparBusca() {
        document.getElementById("busca-input").value = "";
        document.getElementById("busca-clear").style.display = "none";
        document.getElementById("busca-resultado").style.display = "none";
      }

      async function carregarRecorrentesVencendo() {
        const wrap = document.getElementById("rec-vencendo-wrap");
        const data = await fetchAPI("/api/recorrentes/vencendo?dias=7");
        const lista = Array.isArray(data) ? data : [];
        if (lista.length === 0) {
          wrap.innerHTML = "";
          return;
        }
        const FREQ = {
          diaria: "Diária",
          semanal: "Semanal",
          quinzenal: "Quinzenal",
          mensal: "Mensal",
          bimestral: "Bimestral",
          trimestral: "Trimestral",
          semestral: "Semestral",
          anual: "Anual",
        };
        const hoje = new Date().toISOString().split("T")[0];
        wrap.innerHTML = `
          <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <div style="display:flex;align-items:center;gap:8px">
                <i class="fa-solid fa-rotate" style="color:#f59e0b"></i>
                <span style="font-size:14px;font-weight:600">Recorrentes nos próximos 7 dias</span>
              </div>
              <a href="/lancamentos.html?aba=recorrentes" style="font-size:12px;color:var(--green);text-decoration:none;font-weight:600">Ver todas →</a>
            </div>
            ${lista
              .map((r) => {
                const proxima = r.proxima_geracao
                  ? r.proxima_geracao.split("T")[0]
                  : null;
                const vencida = proxima && proxima < hoje;
                const ehHoje = proxima === hoje;
                const cor = vencida
                  ? "var(--red)"
                  : ehHoje
                    ? "#f59e0b"
                    : "var(--text-muted)";
                const label = vencida
                  ? "Vencida"
                  : ehHoje
                    ? "Hoje"
                    : formatarData(proxima);
                const sinal = r.tipo === "receita" ? "+" : "-";
                const corValor =
                  r.tipo === "receita" ? "var(--green)" : "var(--red)";
                return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)">
                <div style="flex:1">
                  <div style="font-size:14px;font-weight:600;margin-bottom:2px">${r.descricao}</div>
                  <div style="font-size:11px;color:var(--text-muted)">${FREQ[r.frequencia] || r.frequencia}${r.categoria_nome ? ` · ${r.categoria_nome}` : ""}</div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:14px;font-weight:700;color:${corValor}">${sinal}${formatarMoeda(r.valor)}</div>
                  <div style="font-size:11px;font-weight:600;color:${cor}">${label}</div>
                </div>
              </div>`;
              })
              .join("")}
          </div>`;
      }

      const WIZARD_ITENS = (data) => [
        { feito: true,                  icon: "fa-user",        label: "Criar sua conta",         desc: "Conta criada com sucesso!",                       link: null },
        { feito: data.tem_conta > 0,    icon: "fa-wallet",      label: "Adicionar conta bancária", desc: "Cadastre seu saldo inicial em cada conta",        link: "/contas.html" },
        { feito: data.tem_transacao > 0,icon: "fa-right-left",  label: "Primeiro lançamento",      desc: "Registre uma receita ou despesa",                 link: "/lancamentos.html" },
        { feito: data.tem_cartao > 0,   icon: "fa-credit-card", label: "Cadastrar um cartão",      desc: "Acompanhe faturas e gastos no cartão",            link: "/contas.html?aba=cartoes" },
        { feito: !!data.telegram_chat_id,icon:"fa-brands fa-telegram",label:"Conectar Telegram",  desc: "Lance gastos direto pelo chat do Telegram",       link: "/configuracoes.html" },
      ];

      async function carregarChecklist() {
        if (localStorage.getItem("controlai_onboarding_checklist")) return;
        const data = await fetchAPI("/api/auth/onboarding");
        if (!data) return;
        const itens = WIZARD_ITENS(data);
        const total = itens.length;
        const feitos = itens.filter((i) => i.feito).length;
        if (feitos === total) { localStorage.setItem("controlai_onboarding_checklist", "1"); return; }

        if (feitos <= 1) {
          // Usuário novo: modal wizard
          abrirWizard(itens);
        } else {
          // Usuário em progresso: checklist inline melhorado
          renderChecklist(itens, feitos, total);
        }
      }

      function renderChecklist(itens, feitos, total) {
        const pct = Math.round((feitos / total) * 100);
        const pendentes = itens.filter((i) => !i.feito);
        document.getElementById("checklist-wrap").innerHTML = `
          <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <div>
                <div style="font-size:14px;font-weight:600;margin-bottom:2px">Configure sua conta</div>
                <div style="font-size:12px;color:var(--text-muted)">${feitos} de ${total} passos completos</div>
              </div>
              <button onclick="fecharChecklist()" style="background:transparent;border:none;color:var(--text-muted);font-size:20px;cursor:pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            ${itens.map((item) => `
              <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)">
                <div style="width:28px;height:28px;border-radius:50%;background:${item.feito ? "var(--green)" : "var(--bg-tertiary)"};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                  <i class="${item.feito ? "fa-solid fa-check" : "fa-solid " + item.icon}" style="font-size:11px;color:${item.feito ? "#fff" : "var(--text-muted)"}"></i>
                </div>
                <div style="flex:1">
                  <div style="font-size:13px;color:${item.feito ? "var(--text-muted)" : "var(--text-primary)"};${item.feito ? "text-decoration:line-through" : "font-weight:500"}">${item.label}</div>
                  ${!item.feito ? `<div style="font-size:11px;color:var(--text-muted)">${item.desc}</div>` : ""}
                </div>
                ${!item.feito && item.link ? `<a href="${item.link}" style="font-size:12px;color:var(--green);text-decoration:none;font-weight:600;white-space:nowrap">Ir →</a>` : ""}
              </div>`).join("")}
            <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
              <div style="flex:1;background:var(--bg-tertiary);border-radius:99px;height:5px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:var(--green);border-radius:99px;transition:width 0.4s ease"></div>
              </div>
              <span style="font-size:11px;color:var(--text-muted);min-width:30px">${pct}%</span>
            </div>
          </div>`;
      }

      let _wizardStep = 0;
      let _wizardItens = [];

      function abrirWizard(itens) {
        _wizardItens = itens.filter((i) => !i.feito || i.link === null);
        _wizardStep = 0;
        renderWizardStep();
        document.getElementById("modal-wizard").style.display = "flex";
      }

      function renderWizardStep() {
        const pendentes = _wizardItens.filter((i) => !i.feito);
        if (!pendentes.length) { fecharWizard(); return; }
        const item = pendentes[_wizardStep] || pendentes[0];
        const total = pendentes.length;
        const idx = pendentes.indexOf(item);
        document.getElementById("wizard-body").innerHTML = `
          <div style="text-align:center;padding:8px 0 20px">
            <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),#059669);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
              <i class="fa-solid ${item.icon}" style="font-size:22px;color:#fff"></i>
            </div>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px">${item.label}</div>
            <div style="font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.6">${item.desc}</div>
            <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
              ${pendentes.map((_, i) => `<div style="width:8px;height:8px;border-radius:50%;background:${i === idx ? "var(--green)" : "var(--bg-tertiary)"}"></div>`).join("")}
            </div>
            <a href="${item.link}" style="display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:13px 32px;border-radius:10px;font-weight:600;font-size:15px;margin-bottom:12px">
              Configurar agora →
            </a>
            <br>
            ${idx < total - 1
              ? `<button onclick="_wizardStep++;renderWizardStep()" style="background:transparent;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;margin-top:4px">Fazer depois →</button>`
              : `<button onclick="fecharWizard()" style="background:transparent;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;margin-top:4px">Fechar</button>`
            }
          </div>`;
      }

      function fecharWizard() {
        document.getElementById("modal-wizard").style.display = "none";
        localStorage.setItem("controlai_onboarding_checklist", "1");
      }

      function fecharChecklist() {
        document.getElementById("checklist-wrap").innerHTML = "";
        localStorage.setItem("controlai_onboarding_checklist", "1");
      }

      // ── Saldo acumulado dia a dia ──
      let chartSaldoDiario = null;
      async function carregarSaldoDiario() {
        const wrap = document.getElementById("saldo-diario-wrap");
        const data = await fetchAPI(`/api/relatorios/saldo-diario?mes=${mes}&ano=${ano}`);
        if (!Array.isArray(data) || data.every((d) => d.saldo === 0)) { wrap.innerHTML = ""; return; }

        const hoje = new Date();
        const mesAtual = mes === hoje.getMonth() + 1 && ano === hoje.getFullYear();
        const corte = mesAtual ? hoje.getDate() : data.length;
        const dados = data.slice(0, corte);
        const minVal = Math.min(...dados.map((d) => d.saldo));
        const cor = minVal >= 0 ? "#10b981" : dados[dados.length - 1].saldo >= 0 ? "#10b981" : "#ef4444";

        wrap.innerHTML = `
          <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
            <h3 style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:12px">
              <i class="fa-solid fa-chart-line" style="color:#3b82f6;margin-right:6px"></i>Saldo dia a dia — ${nomeMes(mes)}
            </h3>
            <canvas id="chart-saldo-diario" height="110"></canvas>
          </div>`;

        const mutedColor = getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#6b7280";
        if (chartSaldoDiario) chartSaldoDiario.destroy();
        chartSaldoDiario = new Chart(document.getElementById("chart-saldo-diario"), {
          type: "line",
          data: {
            labels: dados.map((d) => d.dia),
            datasets: [{
              data: dados.map((d) => d.saldo),
              borderColor: cor,
              backgroundColor: cor + "18",
              fill: true, tension: 0.35,
              pointRadius: dados.length > 20 ? 0 : 3,
              pointHoverRadius: 5,
              borderWidth: 2,
            }],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` ${formatarMoedaRaw(ctx.parsed.y)}` } },
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: mutedColor, font: { size: 10 } } },
              y: {
                grid: { color: "rgba(107,114,128,0.1)" },
                ticks: { color: mutedColor, font: { size: 10 }, callback: (v) => "R$" + (Math.abs(v) >= 1000 ? (v / 1000).toFixed(0) + "k" : v) },
              },
            },
          },
        });
      }

      let _metasAberta = null;

      async function carregarMetas() {
        const wrap = document.getElementById("metas-wrap");
        const data = await fetchAPI("/api/metas");
        if (!Array.isArray(data) || !data.filter((m) => m.status === "ativa").length) {
          wrap.innerHTML = `
            <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:8px">
                <i class="fa-solid fa-bullseye" style="color:#f59e0b"></i>
                <span style="font-size:13px;color:var(--text-muted)">Sem metas cadastradas</span>
              </div>
              <button onclick="abrirModalMeta()" style="background:transparent;border:0.5px solid var(--border);color:var(--text-secondary);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer">+ Nova meta</button>
            </div>`;
          return;
        }
        const ativas = data.filter((m) => m.status === "ativa");
        wrap.innerHTML = `
          <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:8px">
                <i class="fa-solid fa-bullseye" style="color:#f59e0b"></i>
                <span style="font-size:14px;font-weight:600">Metas de economia</span>
              </div>
              <button onclick="abrirModalMeta()" style="background:transparent;border:0.5px solid var(--border);color:var(--text-secondary);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer">+ Nova</button>
            </div>
            ${ativas.map((m) => {
              const pct = m.valor_alvo > 0 ? Math.min(100, (m.valor_atual / m.valor_alvo) * 100) : 0;
              const cor = pct >= 100 ? "var(--green)" : pct >= 60 ? "#f59e0b" : "#3b82f6";
              const dias = m.prazo ? Math.ceil((new Date(m.prazo) - new Date()) / 86400000) : null;
              const concluida = pct >= 100;
              return `
                <div style="margin-bottom:12px;cursor:pointer" onclick="abrirModalMeta(${m.id})">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
                    <span style="font-size:13px;font-weight:600">${m.nome}${concluida ? ' <i class="fa-solid fa-check-circle" style="color:var(--green);font-size:11px"></i>' : ""}</span>
                    <span style="font-size:12px;color:var(--text-muted)">${formatarMoedaRaw(m.valor_atual)} / ${formatarMoedaRaw(m.valor_alvo)}</span>
                  </div>
                  <div style="background:var(--bg-tertiary);border-radius:99px;height:7px;overflow:hidden;margin-bottom:4px">
                    <div style="height:100%;width:${pct}%;background:${cor};border-radius:99px;transition:width 0.6s ease"></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)">
                    <span>${pct.toFixed(0)}%</span>
                    ${dias !== null ? `<span>${dias > 0 ? dias + "d" : "Vencida"}</span>` : ""}
                  </div>
                </div>`;
            }).join("")}
          </div>`;
      }

      function abrirModalMeta(id = null) {
        _metasAberta = id;
        const modal = document.getElementById("modal-meta");
        const titulo = document.getElementById("modal-meta-titulo");
        titulo.textContent = id ? "Editar meta" : "Nova meta";
        document.getElementById("meta-nome").value = "";
        document.getElementById("meta-alvo").value = "";
        document.getElementById("meta-atual").value = "";
        document.getElementById("meta-prazo").value = "";
        document.getElementById("modal-meta-deletar").style.display = "none";

        if (id) {
          fetchAPI("/api/metas").then((data) => {
            if (!data) return;
            const m = data.find((x) => x.id === id);
            if (!m) return;
            document.getElementById("meta-nome").value = m.nome;
            document.getElementById("meta-alvo").value = parseFloat(m.valor_alvo).toFixed(2).replace(".", ",");
            document.getElementById("meta-atual").value = parseFloat(m.valor_atual).toFixed(2).replace(".", ",");
            document.getElementById("meta-prazo").value = m.prazo ? m.prazo.split("T")[0] : "";
            document.getElementById("modal-meta-deletar").style.display = "inline-flex";
          });
        }
        modal.style.display = "flex";
      }

      async function salvarMeta() {
        const nome = document.getElementById("meta-nome").value.trim();
        const valorAlvo = lerValorMoeda(document.getElementById("meta-alvo"));
        const valorAtual = lerValorMoeda(document.getElementById("meta-atual"));
        const prazo = document.getElementById("meta-prazo").value || null;
        if (!nome || !valorAlvo) { toast("Preencha nome e valor alvo.", "erro"); return; }

        if (_metasAberta) {
          await fetchAPI(`/api/metas/${_metasAberta}`, {
            method: "PUT",
            body: JSON.stringify({ nome, valor_alvo: valorAlvo, valor_atual: valorAtual, prazo, status: "ativa" }),
          });
          toast("Meta atualizada!");
        } else {
          await fetchAPI("/api/metas", {
            method: "POST",
            body: JSON.stringify({ nome, valor_alvo: valorAlvo, valor_atual: valorAtual, prazo }),
          });
          toast("Meta criada!");
        }
        fecharModalMeta();
        carregarMetas();
      }

      async function deletarMeta() {
        if (!_metasAberta) return;
        const ok = await confirmar("Deletar esta meta?");
        if (!ok) return;
        await fetchAPI(`/api/metas/${_metasAberta}`, { method: "DELETE" });
        toast("Meta deletada.", "info");
        fecharModalMeta();
        carregarMetas();
      }

      function fecharModalMeta() {
        document.getElementById("modal-meta").style.display = "none";
      }

      // ── Gráfico de barras — evolução 6 meses ──
      async function carregarGrafico6Meses() {
        const data = await fetchAPI("/api/relatorios/evolucao");
        _evolucaoData = data;
        const wrap = document.getElementById("grafico-6meses");
        if (!Array.isArray(data) || data.length < 2) { wrap.innerHTML = ""; return; }

        wrap.innerHTML = `
          <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px">
            <h3 style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:12px">
              <i class="fa-solid fa-chart-bar" style="color:var(--green);margin-right:6px"></i>Evolução dos últimos 6 meses
            </h3>
            <canvas id="chart-6meses" height="150"></canvas>
          </div>`;

        const mutedColor = getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#6b7280";
        const labels = data.map((d) => nomeMes(d.mes).substring(0, 3) + "/" + String(d.ano).substring(2));
        const receitas = data.map((d) => parseFloat(d.receitas) || 0);
        const despesas = data.map((d) => parseFloat(d.despesas) || 0);

        if (chart6Meses) chart6Meses.destroy();
        chart6Meses = new Chart(document.getElementById("chart-6meses"), {
          type: "bar",
          data: {
            labels,
            datasets: [
              { label: "Receitas", data: receitas, backgroundColor: "rgba(16,185,129,0.75)", borderRadius: 4, borderWidth: 0 },
              { label: "Despesas", data: despesas, backgroundColor: "rgba(239,68,68,0.75)", borderRadius: 4, borderWidth: 0 },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: "top", labels: { color: mutedColor, font: { size: 11 }, padding: 10, boxWidth: 10 } },
              tooltip: { callbacks: { label: (ctx) => ` ${formatarMoedaRaw(ctx.parsed.y)}` } },
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: mutedColor, font: { size: 11 } } },
              y: {
                grid: { color: "rgba(107,114,128,0.1)" },
                ticks: {
                  color: mutedColor, font: { size: 11 },
                  callback: (v) => "R$ " + (v >= 1000 ? (v / 1000).toFixed(1) + "k" : v),
                },
              },
            },
          },
        });
      }

      // ── Insight: variação de despesas em relação à média recente ──
      function _renderInsight(evolucao, resumo) {
        const wrap = document.getElementById("insight-variacao");
        if (!wrap || !Array.isArray(evolucao) || !resumo) return;

        const mesAtualKey = `${ano}-${mes}`;
        const anteriores = evolucao.filter((d) => !(d.mes == mes && d.ano == ano));
        if (anteriores.length < 2) return;

        const ultimos = anteriores.slice(-3);
        const avgDespesas = ultimos.reduce((s, d) => s + (parseFloat(d.despesas) || 0), 0) / ultimos.length;
        const despesasAtual = parseFloat(resumo.total_despesas) || 0;
        if (avgDespesas <= 0 || despesasAtual <= 0) return;

        const diff = ((despesasAtual - avgDespesas) / avgDespesas) * 100;
        if (Math.abs(diff) < 5) return;

        const acima = diff > 0;
        const cor = acima ? "var(--red)" : "var(--green)";
        const icone = acima ? "fa-arrow-trend-up" : "fa-arrow-trend-down";
        const pct = Math.abs(diff).toFixed(0);
        const msg = acima
          ? `Despesas ${pct}% acima da média dos últimos ${ultimos.length} meses`
          : `Despesas ${pct}% abaixo da média dos últimos ${ultimos.length} meses`;

        wrap.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;background:${acima ? "rgba(239,68,68,0.07)" : "rgba(16,185,129,0.07)"};border:0.5px solid ${acima ? "rgba(239,68,68,0.25)" : "rgba(16,185,129,0.25)"};border-radius:10px;padding:10px 14px;margin-bottom:16px">
            <i class="fa-solid ${icone}" style="color:${cor};font-size:14px;flex-shrink:0"></i>
            <span style="font-size:13px;color:var(--text-secondary)">${msg}</span>
          </div>`;
      }

      async function carregarPetsWidget() {
        const wrap = document.getElementById("pets-widget");
        if (!wrap) return;
        const data = await fetchAPI("/api/pets/dashboard");
        if (!data || !data.pets?.length) return;

        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const alertas = data.proximos_eventos?.filter((e) => {
          const d = new Date(e.proxima_data);
          return Math.ceil((d - hoje) / 86400000) <= 7;
        }) || [];

        wrap.innerHTML = `
          <div style="margin-bottom:20px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h2 style="margin:0;font-size:15px;font-weight:600"><i class="fa-solid fa-paw" style="color:var(--green);margin-right:7px"></i>Meus Pets</h2>
              <a href="/pets.html" style="font-size:12px;color:var(--green);text-decoration:none;font-weight:600">Ver tudo →</a>
            </div>
            ${alertas.length ? `
              <div style="background:rgba(239,68,68,0.07);border:0.5px solid rgba(239,68,68,0.25);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#ef4444;display:flex;gap:8px;align-items:center">
                <i class="fa-solid fa-triangle-exclamation" style="flex-shrink:0"></i>
                <span>${alertas.length === 1
                  ? `<b>${alertas[0].pet_emoji || "🐾"} ${alertas[0].pet_nome}</b>: ${alertas[0].descricao} vence em breve`
                  : `${alertas.length} eventos de saúde precisam de atenção`
                }</span>
              </div>
            ` : ""}
            <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none">
              ${data.pets.map((p) => `
                <a href="/pets.html" style="text-decoration:none;flex-shrink:0">
                  <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:14px;min-width:110px;text-align:center;transition:border-color 0.2s" onmouseenter="this.style.borderColor='var(--green)'" onmouseleave="this.style.borderColor='var(--border)'">
                    <div style="font-size:32px;line-height:1;margin-bottom:6px">${p.emoji || "🐾"}</div>
                    <div style="font-size:13px;font-weight:600;color:var(--text-primary)">${p.nome}</div>
                    ${p.gasto_mes > 0 ? `<div style="font-size:11px;color:var(--red);margin-top:3px;font-weight:500" class="valor-privado">${new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(p.gasto_mes)}</div>` : `<div style="font-size:11px;color:var(--text-muted);margin-top:3px">sem gastos</div>`}
                  </div>
                </a>
              `).join("")}
            </div>
          </div>`;
        aplicarPrivacidade();
      }

      atualizarLabel();
      carregarDados();
      carregarChecklist();
      carregarPetsWidget();
      initPullToRefresh(carregarDados);
      initSwipeMes(mudarMes);

    </script>

      <div style="background:var(--bg-secondary);border-radius:20px;width:100%;max-width:380px;border:0.5px solid var(--border);overflow:hidden">
        <div style="background:linear-gradient(135deg,#0f1117,#1a1f2e);padding:20px 24px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between">

              <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:5px">Valor alvo (R$)</label>

              <input id="meta-atual" type="text" inputmode="decimal" placeholder="0,00" style="width:100%;background:var(--bg-tertiary);border:0.5px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text-primary);font-size:14px;box-sizing:border-box">

    <!-- Modal detalhe de categoria -->

      <div style="background:var(--bg-secondary);border-radius:16px;width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;border:0.5px solid var(--border)">
