<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controlaí — Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
      .charts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }
      .chart-card {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      .chart-card h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }
      .mes-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        padding-top: 4px;
      }
      .mes-nav button {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .mes-nav button:hover {
        background: var(--bg-tertiary);
      }
      .mes-nav span {
        font-size: 15px;
        font-weight: 600;
        min-width: 140px;
        text-align: center;
      }
      .checklist-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 6px;
        transition: background 0.15s;
      }
      .checklist-item.feito {
        background: var(--bg-tertiary);
      }
      .checklist-item.pendente {
        background: var(--bg-primary);
        border: 0.5px solid var(--border);
      }
      .checklist-circulo {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
      <div class="mes-nav">
        <button onclick="mudarMes(-1)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="mes-label"></span>
        <button onclick="mudarMes(1)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Checklist -->
      <div id="checklist-wrap"></div>

      <div class="cards-grid" id="cards-resumo"></div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>Evolução dos últimos 6 meses</h3>
          <canvas id="chart-evolucao" height="200"></canvas>
        </div>
        <div class="chart-card">
          <h3>Despesas por categoria</h3>
          <canvas id="chart-categorias" height="200"></canvas>
        </div>
      </div>

      <div style="margin-top: 24px">
        <div class="table-wrap">
          <div class="table-header">
            <h2>Últimas transações</h2>
            <a href="/lancamentos.html" class="btn">
              <i class="fa-solid fa-plus"></i> Nova
            </a>
          </div>
          <div id="lista-dashboard"></div>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>

    <script src="/js/global.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      verificarAuth();
      document.getElementById("sidebar").innerHTML = renderSidebar("Dashboard");
      document.getElementById("tabbar").innerHTML = renderTabBar("Início");

      let { mes, ano } = getMesAno();
      let chartEvolucao = null;
      let chartCategorias = null;

      function atualizarLabel() {
        document.getElementById("mes-label").textContent =
          `${nomeMes(mes)} ${ano}`;
      }

      function mudarMes(delta) {
        mes += delta;
        if (mes > 12) {
          mes = 1;
          ano++;
        }
        if (mes < 1) {
          mes = 12;
          ano--;
        }
        atualizarLabel();
        carregarDados();
      }

      async function carregarDados() {
        document.getElementById("cards-resumo").innerHTML = skeletonCards(4);
        document.getElementById("lista-dashboard").innerHTML = skeletonLista(3);
        await Promise.all([
          carregarResumo(),
          carregarTransacoes(),
          carregarEvolucao(),
          carregarCategorias(),
        ]);
      }

      async function carregarResumo() {
        const data = await fetchAPI(
          `/api/relatorios/resumo?mes=${mes}&ano=${ano}`,
        );
        if (!data) return;
        document.getElementById("cards-resumo").innerHTML = `
      <div class="card"><div class="card-label">Receitas</div><div class="card-value green">${formatarMoeda(data.total_receitas)}</div></div>
      <div class="card"><div class="card-label">Despesas</div><div class="card-value red">${formatarMoeda(data.total_despesas)}</div></div>
      <div class="card"><div class="card-label">Saldo do mês</div><div class="card-value blue">${formatarMoeda(data.saldo)}</div></div>
      <div class="card"><div class="card-label">Transações</div><div class="card-value" id="total-transacoes">0</div></div>
    `;
      }

      async function carregarTransacoes() {
        const data = await fetchAPI(`/api/transacoes?mes=${mes}&ano=${ano}`);
        if (!data) return;
        const el = document.getElementById("total-transacoes");
        if (el) el.textContent = data.length;
        const lista = document.getElementById("lista-dashboard");
        if (data.length === 0) {
          lista.innerHTML = emptyState(
            "fa-right-left",
            "Nenhuma transação",
            "Nenhuma transação encontrada neste mês.",
            "Novo lançamento",
            "window.location.href='/lancamentos.html'",
          );
          return;
        }
        lista.innerHTML = `<table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead>
      <tbody>${data
        .slice(0, 8)
        .map(
          (t) => `
        <tr>
          <td>${formatarData(t.data)}</td>
          <td>${t.descricao}</td>
          <td><span style="display:inline-flex;align-items:center;gap:5px">
            <span style="width:8px;height:8px;border-radius:50%;background:${t.categoria_cor || "#6b7280"}"></span>
            ${t.categoria_nome || "—"}
          </span></td>
          <td><span class="badge ${t.tipo}">${formatarMoeda(t.valor)}</span></td>
        </tr>
      `,
        )
        .join("")}</tbody>
    </table>`;
      }

      async function carregarEvolucao() {
        const data = await fetchAPI("/api/relatorios/evolucao");
        if (!data) return;
        const labels = data.map((d) => `${nomeMes(d.mes).substring(0, 3)}`);
        const receitas = data.map((d) => parseFloat(d.receitas) || 0);
        const despesas = data.map((d) => parseFloat(d.despesas) || 0);
        if (chartEvolucao) chartEvolucao.destroy();
        chartEvolucao = new Chart(document.getElementById("chart-evolucao"), {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Receitas",
                data: receitas,
                backgroundColor: "#10b981",
                borderRadius: 4,
              },
              {
                label: "Despesas",
                data: despesas,
                backgroundColor: "#ef4444",
                borderRadius: 4,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                labels: { color: "#9ca3af", font: { size: 11 }, boxWidth: 12 },
              },
            },
            scales: {
              x: {
                ticks: { color: "#6b7280", font: { size: 10 }, maxRotation: 0 },
                grid: { color: "#2d3748" },
              },
              y: {
                ticks: { color: "#6b7280", font: { size: 10 } },
                grid: { color: "#2d3748" },
              },
            },
          },
        });
      }

      async function carregarCategorias() {
        const data = await fetchAPI(
          `/api/relatorios/por-categoria?mes=${mes}&ano=${ano}&tipo=despesa`,
        );
        if (!data || data.length === 0) return;
        const labels = data.map((d) => d.nome || "Sem categoria");
        const valores = data.map((d) => parseFloat(d.total) || 0);
        const cores = data.map((d) => d.cor || "#6b7280");
        if (chartCategorias) chartCategorias.destroy();
        chartCategorias = new Chart(
          document.getElementById("chart-categorias"),
          {
            type: "doughnut",
            data: {
              labels,
              datasets: [
                { data: valores, backgroundColor: cores, borderWidth: 0 },
              ],
            },
            options: {
              responsive: true,
              plugins: {
                legend: {
                  position: "bottom",
                  labels: {
                    color: "#9ca3af",
                    font: { size: 11 },
                    padding: 10,
                    boxWidth: 12,
                  },
                },
              },
            },
          },
        );
      }

      async function carregarChecklist() {
        const jaCompleto = localStorage.getItem(
          "controlai_onboarding_checklist",
        );
        if (jaCompleto) return;

        const data = await fetchAPI("/api/auth/onboarding");
        if (!data) return;

        const itens = [
          {
            feito: true,
            icon: "fa-user",
            label: "Criar sua conta",
            link: null,
          },
          {
            feito: data.tem_conta > 0,
            icon: "fa-wallet",
            label: "Adicionar uma conta bancária",
            link: "/contas.html",
          },
          {
            feito: data.tem_transacao > 0,
            icon: "fa-right-left",
            label: "Lançar seu primeiro gasto",
            link: "/lancamentos.html",
          },
          {
            feito: data.tem_cartao > 0,
            icon: "fa-credit-card",
            label: "Cadastrar um cartão",
            link: "/cartoes.html",
          },
          {
            feito: !!data.telegram_chat_id,
            icon: "fa-telegram",
            label: "Conectar o Telegram",
            link: "/perfil.html",
          },
        ];

        const totalFeitos = itens.filter((i) => i.feito).length;
        const pct = Math.round((totalFeitos / itens.length) * 100);

        if (totalFeitos === itens.length) {
          localStorage.setItem("controlai_onboarding_checklist", "1");
          return;
        }

        const wrap = document.getElementById("checklist-wrap");
        wrap.innerHTML = `
      <div style="background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div>
            <div style="font-size:14px;font-weight:600;margin-bottom:2px">Configure sua conta</div>
            <div style="font-size:12px;color:var(--text-muted)">${totalFeitos} de ${itens.length} passos completos</div>
          </div>
          <button onclick="fecharChecklist()" style="background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div style="margin-bottom:12px">
          ${itens
            .map(
              (item) => `
            <div class="checklist-item ${item.feito ? "feito" : "pendente"}">
              <div class="checklist-circulo" style="background:${item.feito ? "#10b981" : "var(--bg-tertiary)"}">
                <i class="fa-solid ${item.feito ? "fa-check" : item.icon}" style="font-size:11px;color:${item.feito ? "#fff" : "var(--text-muted)"}"></i>
              </div>
              <span style="flex:1;font-size:13px;color:${item.feito ? "var(--text-muted)" : "var(--text-primary)"};${item.feito ? "text-decoration:line-through" : ""}">
                ${item.label}
              </span>
              ${!item.feito && item.link ? `<a href="${item.link}" style="font-size:11px;color:var(--green);text-decoration:none;font-weight:600">Ir →</a>` : ""}
              ${item.feito ? `<i class="fa-solid fa-check" style="font-size:11px;color:var(--green)"></i>` : ""}
            </div>
          `,
            )
            .join("")}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;background:var(--bg-tertiary);border-radius:99px;height:5px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:var(--green);border-radius:99px;transition:width 0.4s ease"></div>
          </div>
          <span style="font-size:11px;color:var(--text-muted);min-width:32px">${pct}%</span>
        </div>
      </div>
    `;
      }

      function fecharChecklist() {
        document.getElementById("checklist-wrap").innerHTML = "";
        localStorage.setItem("controlai_onboarding_checklist", "1");
      }

      atualizarLabel();
      carregarDados();
      carregarChecklist();
    </script>
  </body>
</html>
